<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>H JOEL POD</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;font-family:Arial,Helvetica,sans-serif;color:#20252b}
.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}
.header{padding:15px;text-align:center;background:#fff;border-bottom:4px solid #ff6a00}
.logo{width:100%;max-width:350px;display:block;margin:auto}
.content{padding:18px}
.field{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-size:14px;font-weight:700}
input,select{width:100%;min-height:49px;padding:11px;border:1px solid #ccd0d5;border-radius:9px;background:#fff;font-size:16px;outline:none}
.section-title{margin:20px 0 12px;font-size:15px;font-weight:900}
.btn-dark,.btn-red,.btn-green,.btn-orange{width:100%;min-height:49px;border:0;border-radius:9px;font-size:16px;font-weight:900}
.btn-dark{background:#20252b;color:#fff}
.btn-red{background:#d9342b;color:#fff}
.btn-green{background:#148c47;color:#fff}
.btn-orange{background:#ff6a00;color:#fff}
#reader{width:100%;margin-top:10px;overflow:hidden;border-radius:12px;background:#111}
.photo-card{padding:12px;border:1px dashed #d5d7da;border-radius:12px;margin-bottom:14px}
.photo-preview{display:none;width:100%;max-height:340px;object-fit:contain;border-radius:10px;background:#f5f5f5;margin-top:8px}
.status{display:none;margin-top:15px;padding:12px;border-radius:9px;text-align:center;font-weight:bold;line-height:1.4}
.status.success{display:block;background:#e1f5e9;color:#14723b}
.status.error{display:block;background:#fde5e3;color:#b1261c}
.status.info{display:block;background:#fff0df;color:#975300}
.hint{font-size:12px;color:#7a7f85;margin-top:6px}
.camera-modal{display:none;position:fixed;inset:0;background:#000;z-index:9999;overflow:auto}
.camera-wrap{max-width:520px;margin:auto;min-height:100vh;background:#000;padding:12px}
.camera-title{color:#fff;font-weight:900;text-align:center;padding:10px}
#photoVideo{width:100%;max-height:72vh;object-fit:cover;border-radius:12px;background:#111}
.camera-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.small-note{color:#ddd;text-align:center;font-size:12px;padding:8px 0}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <img src="H_JOEL_LOGISTICS_logo.png" class="logo" alt="H JOEL LOGISTICS">
  </div>

  <div class="content">
    <div class="section-title">PROOF OF DELIVERY</div>

    <div class="field">
      <label>Tanggal POD</label>
      <input type="date" id="tanggalPOD">
    </div>

    <div class="field">
      <label>AWB</label>
      <input type="text" id="awb" placeholder="Ketik manual atau scan AWB">
      <button type="button" class="btn-dark" id="btnStartScanner" onclick="startScanner()" style="margin-top:8px;">📷 MULAI SCAN AWB</button>
      <button type="button" class="btn-red" id="btnStopScanner" onclick="stopScanner()" style="display:none;margin-top:8px;">⛔ STOP SCANNER</button>
      <div id="reader"></div>
      <div class="hint">Scan tampil langsung di aplikasi. Setelah terbaca, AWB langsung masuk ke kolom.</div>
    </div>

    <div class="field">
      <label>Area</label>
      <select id="area">
        <option value="">Memuat Area...</option>
      </select>
    </div>

    <div class="section-title">FOTO POD</div>

    <div class="photo-card">
      <label>Foto Unit, Penerima & Plang Sekolah</label>
      <button type="button" class="btn-orange" onclick="openInternalCamera(1)">📷 AMBIL FOTO</button>
      <img id="preview1" class="photo-preview">
    </div>

    <div class="photo-card">
      <label>Foto Plang / Papan Sekolah</label>
      <button type="button" class="btn-orange" onclick="openInternalCamera(2)">📷 AMBIL FOTO</button>
      <img id="preview2" class="photo-preview">
    </div>

    <div class="photo-card">
      <label>BAST</label>
      <button type="button" class="btn-orange" onclick="openInternalCamera(3)">📷 AMBIL FOTO</button>
      <img id="preview3" class="photo-preview">
    </div>

    <div class="photo-card">
      <label>Foto Serial Number Unit</label>
      <button type="button" class="btn-orange" onclick="openInternalCamera(4)">📷 AMBIL FOTO</button>
      <img id="preview4" class="photo-preview">
    </div>

    <button type="button" class="btn-green" onclick="savePOD()">💾 SIMPAN POD</button>
    <div id="status" class="status"></div>
  </div>
</div>

<div id="cameraModal" class="camera-modal">
  <div class="camera-wrap">
    <div id="cameraTitle" class="camera-title">KAMERA H JOEL</div>
    <video id="photoVideo" autoplay playsinline muted></video>
    <div class="small-note">Timestamp, AWB, Area dan GPS akan ditempel otomatis pada foto.</div>
    <div class="camera-actions">
      <button type="button" class="btn-green" onclick="captureInternalPhoto()">📸 AMBIL FOTO</button>
      <button type="button" class="btn-red" onclick="closeInternalCamera()">TUTUP</button>
    </div>
  </div>
</div>

<script>
let scanner=null;
let scanLock=false;
let audioContext=null;
let photos={1:'',2:'',3:'',4:''};

let photoStream=null;
let activePhotoSlot=0;
let lastGps={lat:null,lng:null};

document.addEventListener('DOMContentLoaded', function(){
  const now=new Date();
  document.getElementById('tanggalPOD').value=
    now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

  try{ AndroidBridge.loadAreas(); }catch(e){}

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      function(pos){
        lastGps.lat=pos.coords.latitude;
        lastGps.lng=pos.coords.longitude;
      },
      function(){},
      {enableHighAccuracy:true,timeout:8000,maximumAge:30000}
    );
  }
});

function setAreas(json){
  try{
    const list=JSON.parse(json||'[]');
    const s=document.getElementById('area');
    s.innerHTML='<option value="">-- PILIH AREA --</option>';
    list.forEach(function(v){
      const o=document.createElement('option');
      o.value=v;o.textContent=v;s.appendChild(o);
    });
  }catch(e){
    showStatus('Area gagal dimuat.','error');
  }
}

async function startScanner(){
  clearStatus();

  try{
    if(!audioContext){
      audioContext=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(audioContext.state==='suspended') await audioContext.resume();
  }catch(e){}

  closeInternalCamera();

  if(scanner) return;

  try{
    scanner=new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {
        fps:12,
        qrbox:function(width){
          let w=Math.floor(width*.90);
          if(w>380) w=380;
          return {width:w,height:140};
        }
      },
      scanSuccess,
      function(){}
    );

    document.getElementById('btnStartScanner').style.display='none';
    document.getElementById('btnStopScanner').style.display='block';

  }catch(e){
    scanner=null;
    showStatus('Kamera scanner gagal dibuka. Pastikan izin kamera diberikan.','error');
  }
}

async function scanSuccess(decodedText){
  if(scanLock) return;

  const awb=String(decodedText||'').trim();
  if(!awb) return;

  scanLock=true;
  document.getElementById('awb').value=awb;
  successBeep();

  if(navigator.vibrate) navigator.vibrate(120);

  showStatus('SCAN BERHASIL: '+awb,'success');
  await stopScanner();

  setTimeout(function(){scanLock=false;},500);
}

async function stopScanner(){
  if(!scanner) return;
  try{
    await scanner.stop();
    scanner.clear();
  }catch(e){}
  scanner=null;
  document.getElementById('btnStartScanner').style.display='block';
  document.getElementById('btnStopScanner').style.display='none';
}

function successBeep(){
  try{
    if(!audioContext) return;
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.frequency.value=1100;
    gain.gain.value=.28;
    oscillator.start();
    oscillator.stop(audioContext.currentTime+.15);
  }catch(e){}
}

async function openInternalCamera(slot){
  clearStatus();

  if(scanner) await stopScanner();
  closeInternalCamera();

  activePhotoSlot=slot;

  const names={
    1:'Foto Unit, Penerima & Plang Sekolah',
    2:'Foto Plang / Papan Sekolah',
    3:'BAST',
    4:'Foto Serial Number Unit'
  };

  document.getElementById('cameraTitle').textContent=names[slot]||'KAMERA H JOEL';

  try{
    photoStream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920},
        height:{ideal:1080}
      },
      audio:false
    });

    const v=document.getElementById('photoVideo');
    v.srcObject=photoStream;
    await v.play();

    document.getElementById('cameraModal').style.display='block';

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(
        function(pos){
          lastGps.lat=pos.coords.latitude;
          lastGps.lng=pos.coords.longitude;
        },
        function(){},
        {enableHighAccuracy:true,timeout:6000,maximumAge:15000}
      );
    }

  }catch(e){
    showStatus('Kamera foto gagal dibuka. Pastikan izin kamera diberikan.','error');
  }
}

function captureInternalPhoto(){
  const video=document.getElementById('photoVideo');

  if(!video.videoWidth || !video.videoHeight){
    showStatus('Kamera belum siap.','error');
    return;
  }

  let width=video.videoWidth;
  let height=video.videoHeight;

  if(width>1600){
    height=Math.round(height*1600/width);
    width=1600;
  }

  const canvas=document.createElement('canvas');
  canvas.width=width;
  canvas.height=height;

  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,width,height);

  const now=new Date();
  const tanggal=String(now.getDate()).padStart(2,'0')+'-'+
                String(now.getMonth()+1).padStart(2,'0')+'-'+
                now.getFullYear();
  const jam=String(now.getHours()).padStart(2,'0')+':'+
            String(now.getMinutes()).padStart(2,'0')+':'+
            String(now.getSeconds()).padStart(2,'0');

  const awb=document.getElementById('awb').value.trim() || '-';
  const area=document.getElementById('area').value || '-';

  const gps=(lastGps.lat!==null && lastGps.lng!==null)
    ? lastGps.lat.toFixed(6)+', '+lastGps.lng.toFixed(6)
    : 'GPS belum tersedia';

  const lines=[
    tanggal+' '+jam,
    'AWB: '+awb,
    'Area: '+area,
    'GPS: '+gps,
    'H JOEL LOGISTICS'
  ];

  const fontSize=Math.max(22,Math.round(width*0.022));
  const padding=Math.round(fontSize*0.7);
  const lineHeight=Math.round(fontSize*1.35);
  const boxHeight=lineHeight*lines.length + padding*2;

  ctx.fillStyle='rgba(0,0,0,0.58)';
  ctx.fillRect(0,height-boxHeight,width,boxHeight);

  ctx.fillStyle='#ffffff';
  ctx.font='bold '+fontSize+'px Arial';
  ctx.textAlign='right';
  ctx.textBaseline='top';

  let y=height-boxHeight+padding;
  lines.forEach(function(line){
    ctx.fillText(line,width-padding,y);
    y+=lineHeight;
  });

  const dataUrl=canvas.toDataURL('image/jpeg',0.78);

  photos[activePhotoSlot]=dataUrl;

  const p=document.getElementById('preview'+activePhotoSlot);
  p.src=dataUrl;
  p.style.display='block';

  closeInternalCamera();

  showStatus('Foto berhasil diambil dan langsung masuk ke form.','success');
}

function closeInternalCamera(){
  if(photoStream){
    photoStream.getTracks().forEach(function(track){track.stop();});
    photoStream=null;
  }

  const v=document.getElementById('photoVideo');
  if(v) v.srcObject=null;

  const m=document.getElementById('cameraModal');
  if(m) m.style.display='none';
}

function savePOD(){
  const payload={
    tanggalPOD:document.getElementById('tanggalPOD').value,
    awb:document.getElementById('awb').value.trim(),
    area:document.getElementById('area').value,
    foto1:photos[1],foto2:photos[2],foto3:photos[3],foto4:photos[4]
  };

  if(!payload.tanggalPOD) return showStatus('Tanggal wajib diisi.','error');
  if(!payload.awb) return showStatus('AWB wajib diisi.','error');
  if(!payload.area) return showStatus('Area wajib dipilih.','error');
  if(!payload.foto1||!payload.foto2||!payload.foto3||!payload.foto4) return showStatus('Semua 4 foto wajib diisi.','error');

  showStatus('Menyimpan POD...','info');
  AndroidBridge.savePOD(JSON.stringify(payload));
}

function saveResult(success,message){
  showStatus(message,success?'success':'error');

  if(success){
    document.getElementById('awb').value='';
    photos={1:'',2:'',3:'',4:''};

    for(let i=1;i<=4;i++){
      const p=document.getElementById('preview'+i);
      p.src='';
      p.style.display='none';
    }
  }
}

function showStatus(message,type){
  const s=document.getElementById('status');
  s.className='status '+type;
  s.textContent=message;
}

function clearStatus(){
  const s=document.getElementById('status');
  s.className='status';
  s.textContent='';
}
</script>
</body>
</html>
