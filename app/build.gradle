plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hjoel.pod'
    compileSdk 35

    defaultConfig {
        applicationId "com.hjoel.pod"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
